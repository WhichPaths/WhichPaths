name: Update Vibe Usage card

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test usage card
        run: node --test scripts/generate-card.test.mjs

      - name: Generate usage card
        run: node scripts/generate-card.mjs
        env:
          VIBE_USAGE_API_KEY: ${{ secrets.VIBE_USAGE_API_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "Lie"
          git config user.email "62231346+WhichPaths@users.noreply.github.com"
          git add vibe-usage-warm.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update vibe usage card"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to push the usage card after 3 attempts."
                exit 1
              fi
              delay=$((attempt * 10))
              echo "::warning::Push attempt $attempt failed; retrying in ${delay}s."
              sleep "$delay"
            done
          fi
